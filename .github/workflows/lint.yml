name: Lint

# Broader than test.yml on purpose: this is the only quality signal on feature
# branches, which test.yml (main/develop only) does not cover. The data branch
# is the hourly-published forecast document, not code: its orphan tree carries
# no workflows, and the explicit ignore keeps even an accidental full-tree push
# there from burning a run.
on:
  push:
    branches-ignore: [ data ]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and check formatting
        run: pnpm lint
